# Configuration for golangci-lint v2. The version is pinned in
# .github/workflows/ci.yml, keep both in sync when upgrading.
version: "2"

run:
  timeout: 5m

linters:
  # The standard set is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - errorlint
    - goheader
    - misspell
    - nolintlint
    - unconvert
  settings:
    goheader:
      template: |-
        Copyright (c) {{ year }} Contributors to the Eclipse Foundation

        See the NOTICE file(s) distributed with this work for additional
        information regarding copyright ownership.

        This program and the accompanying materials are made available under the
        terms of the Apache Software License 2.0 which is available at
        https://www.apache.org/licenses/LICENSE-2.0, or the MIT license
        which is available at https://opensource.org/licenses/MIT.

        SPDX-License-Identifier: Apache-2.0 OR MIT
      values:
        regexp:
          year: '20\d\d'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/eclipse-iceoryx/iceoryx2-go
